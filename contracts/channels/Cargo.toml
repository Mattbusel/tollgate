[package]
name = "tollgate-channels"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Matthew Busel"]
description = "Unidirectional NEAR payment channels for HTTP 402 micropayments by AI agents"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2"
